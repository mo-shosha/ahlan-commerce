[workspace]
resolver = "3"
members = ["apps/api", "packages/catalog", "packages/db", "packages/db/generated"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
catalog = { path = "packages/catalog" }
db = { path = "packages/db" }
# Generated by `make cornucopia-generate` from db/queries/. Only the `db` crate may depend on it.
db-generated = { path = "packages/db/generated" }

axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rootcause = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }

http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
