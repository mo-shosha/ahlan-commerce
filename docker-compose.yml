name: ahlan-commerce

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ahlan_commerce
    ports:
      - "${AHLAN_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ahlan_commerce"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
